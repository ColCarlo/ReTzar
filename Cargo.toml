[package]
name = "retzar"
version = "1.1.0"
edition = "2024"
rust-version = "1.99"
description = "Tzar / Excalibur e il Re Artù rebuilt in Rust and Bevy, from the original game's data"
license = "GPL-3.0-or-later"
readme = "README.md"
publish = false
default-run = "retzar"

[features]
default = ["game"]
# The Bevy front end. Without it only the library and retzar-tools build.
game = ["dep:bevy", "dep:bevy_winit", "dep:wgpu", "dep:winit"]
# Headless test games (retzar-arena): a debug tool, never in the game.
arena = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "=1.1.10"
blake3 = "1"
# The pictures of the portable copy's pack (BMP kept as PNG).
png = "=0.18.1"
bevy = { version = "=0.20.0", optional = true, default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log",
    "2d_bevy_render", "bevy_winit", "keyboard", "mouse",
    "bevy_state"
] }
# Original cursors as hardware cursors. Enabled on the window crates directly:
# bevy's own `custom_cursor` also names the unused bevy_feathers crate.
bevy_winit = { version = "=0.20.0", optional = true, default-features = false, features = [
    "custom_cursor"
] }
# The startup graphics-device check (the renderer's own wgpu).
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = [
    "vulkan"
] }
# Tzar's icon, which build.rs puts in the executable, on the window and the
# taskbar (bevy_winit's own winit).
winit = { version = "=0.30.13", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = [
    "metal"
] }

[[bin]]
name = "retzar"
path = "src/main.rs"
required-features = ["game"]

[[bin]]
name = "retzar-arena"
path = "src/bin/retzar-arena.rs"
required-features = ["arena"]

[build-dependencies]
cc = "1"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Distribution build: `cargo build --release --locked`. Whole-program
# optimization in one unit: a slower build for a faster, smaller game. Panics
# still unwind, so a failed load shows its error instead of closing the game.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"

# Vulkan, plus Metal on macOS: bevy_render without wgpu's DirectX 12 backend.
[patch.crates-io]
bevy_render = { path = "vendor/bevy_render" }
