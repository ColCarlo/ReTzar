# bevy_render 0.20.0 from crates.io, unchanged except for this file: wgpu is
# built with the Vulkan backend only ("dx12" and "metal" removed), the one
# ReTzar renders with. To update, copy the new release here and remove the
# same two features again.

[package]
edition = "2024"
name = "bevy_render"
version = "0.20.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Provides rendering functionality for Bevy Engine"
homepage = "https://bevy.org"
readme = "README.md"
keywords = ["bevy"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bevyengine/bevy"

[package.metadata.docs.rs]
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--generate-macro-expansion",
]
all-features = true

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"

[package.metadata.wgsl-analyzer.dependencies.bevy_core_pipeline]
path = "../bevy_core_pipeline"

[features]
ci_limits = []
debug = [
    "type_label_buffers",
    "bevy_utils/debug",
]
detailed_trace = []
gles = ["wgpu/gles"]
morph = ["bevy_mesh/morph"]
multi_threaded = [
    "bevy_tasks/multi_threaded",
    "bevy_transform/multi_threaded",
]
raw_vulkan_init = ["wgpu/vulkan"]
reflect_auto_register = ["bevy_app/reflect_auto_register"]
reflect_functions = ["bevy_app/reflect_functions"]
serialize = ["bevy_mesh/serialize"]
shader_format_spirv = ["wgpu/spirv"]
spirv_shader_passthrough = ["wgpu/spirv"]
statically-linked-dxc = ["wgpu/static-dxc"]
trace = ["profiling"]
tracing-tracy = ["dep:tracy-client"]
type_label_buffers = []
vulkan-portability = ["wgpu/vulkan-portability"]
webgl = ["wgpu/webgl"]
webgpu = ["wgpu/webgpu"]

[lib]
name = "bevy_render"
path = "src/lib.rs"

[dependencies.async-channel]
version = "2.3.0"

[dependencies.bevy_app]
version = "0.20.0"

[dependencies.bevy_asset]
version = "0.20.0"

[dependencies.bevy_camera]
version = "0.20.0"

[dependencies.bevy_color]
version = "0.20.0"
features = [
    "serialize",
    "wgpu-types",
]

[dependencies.bevy_derive]
version = "0.20.0"

[dependencies.bevy_diagnostic]
version = "0.20.0"

[dependencies.bevy_ecs]
version = "0.20.0"

[dependencies.bevy_encase_derive]
version = "0.20.0"

[dependencies.bevy_extract]
version = "0.20.0"

[dependencies.bevy_extract_macros]
version = "0.20.0"

[dependencies.bevy_image]
version = "0.20.0"

[dependencies.bevy_log]
version = "0.20.0"

[dependencies.bevy_material]
version = "0.20.0"

[dependencies.bevy_material_macros]
version = "0.20.0"

[dependencies.bevy_math]
version = "0.20.0"

[dependencies.bevy_mesh]
version = "0.20.0"

[dependencies.bevy_platform]
version = "0.20.0"
features = [
    "std",
    "serialize",
    "bytemuck",
]
default-features = false

[dependencies.bevy_reflect]
version = "0.20.0"

[dependencies.bevy_render_macros]
version = "0.20.0"

[dependencies.bevy_shader]
version = "0.20.0"

[dependencies.bevy_shape]
version = "0.20.0"

[dependencies.bevy_tasks]
version = "0.20.0"

[dependencies.bevy_time]
version = "0.20.0"

[dependencies.bevy_transform]
version = "0.20.0"

[dependencies.bevy_utils]
version = "0.20.0"

[dependencies.bevy_window]
version = "0.20.0"

[dependencies.bitflags]
version = "2"

[dependencies.bytemuck]
version = "1.5"
features = [
    "derive",
    "must_cast",
]

[dependencies.derive_more]
version = "2"
features = ["from"]
default-features = false

[dependencies.downcast-rs]
version = "2"
features = ["std"]
default-features = false

[dependencies.encase]
version = "0.12"

[dependencies.glam]
version = "0.33.2"
features = [
    "std",
    "encase",
]
default-features = false

[dependencies.image]
version = "0.25.2"
default-features = false

[dependencies.indexmap]
version = "2"

[dependencies.itertools]
version = "0.14"

[dependencies.nonmax]
version = "0.5"

[dependencies.offset-allocator]
version = "0.2"

[dependencies.profiling]
version = "1"
features = ["profile-with-tracing"]
optional = true

[dependencies.smallvec]
version = "1"
features = ["const_new"]
default-features = false

[dependencies.static_assertions]
version = "1"

[dependencies.thiserror]
version = "2"
default-features = false

[dependencies.tracing]
version = "0.1"

[dependencies.tracy-client]
version = "0.19.0"
optional = true

[dependencies.variadics_please]
version = "2.0"

[dependencies.weak-table]
version = "0.4"

[dependencies.wgpu]
version = "30"
features = [
    "wgsl",
    "vulkan",
    "fragile-send-sync-non-atomic-wasm",
]
default-features = false

[dependencies.wgpu-types]
version = "30"
default-features = false

[dev-dependencies.proptest]
version = "1"

[dev-dependencies.proptest-derive]
version = "0.8"

[dev-dependencies.wgpu]
version = "30"
features = ["noop"]
default-features = false

[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies.send_wrapper]
version = "0.6.0"

[target.'cfg(target_arch = "wasm32")'.dependencies.bevy_app]
version = "0.20.0"
features = ["web"]
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.bevy_platform]
version = "0.20.0"
features = ["web"]
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.bevy_reflect]
version = "0.20.0"
features = ["web"]
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.js-sys]
version = "0.3.83"

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.67"
features = [
    "Blob",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Url",
    "Window",
]

[lints.clippy]
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
needless_lifetimes = "allow"
nonstandard_macro_braces = "warn"
print_stderr = "warn"
print_stdout = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
ref_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "allow"
too_long_first_doc_paragraph = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(docsrs_dep)"]
