# Builds the game, tools, tests and retzar-arena on Windows and macOS.
# macOS also runs selected tests that do not need the original game data.
# Version tags are built by release.yml.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain is the one in rust-toolchain.toml, installed by rustup.
      - name: Toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Game, tools and tests
        run: cargo build --locked --all-targets
      - name: retzar-arena
        run: cargo build --locked --no-default-features --features arena --bin retzar-arena

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Game, tools and tests
        run: cargo build --locked --all-targets
      - name: retzar-arena
        run: cargo build --locked --no-default-features --features arena --bin retzar-arena
      - name: Saved installation paths
        run: cargo test --locked --no-default-features --lib paths::tests
      - name: First-run installation detection
        run: cargo test --locked --no-default-features --lib first_start::tests
      - name: MP4 encoding and playback
        run: cargo test --locked --no-default-features --lib media::tests
